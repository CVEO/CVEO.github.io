name: Deploy to GitHub Pages

on:
  # 每次推送到 `main` 分支时触发
  push:
    branches: [ main ]
  # 允许在 GitHub Actions 标签页中手动触发
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，取消旧的进行中的构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 质量门禁：类型检查必须通过
      - name: Type check
        run: npm run check:types

      - name: Build
        run: npm run build

      # 质量门禁：HTML 校验必须通过
      - name: HTML check
        run: npm run check:html

      # 质量门禁：站内链接必须全部可达（外链失效仅告警）
      - name: Link check
        run: npm run check:links

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
